<style>

}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {

  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background-image: radial-gradient(rgba(140,151,168,.22) 1px, transparent 1.6px);
  background-size: 24px 24px;
  -webkit-mask-image: radial-gradient(60% 60% at 50% 50%, #000 0%, transparent 75%);

}
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: think 1.3s var(--ease) infinite; }
.dots i:nth-child(2) { animation-delay: .16s; }
.dots i:nth-child(3) { animation-delay: .32s; }
@keyframes think {
  0%, 80%, 100% { transform: translateY(0) scale(.75); opacity: .35; }
  40% { transform: translateY(-3px) scale(1); opacity: 1; }
}
h1 {
  font-family: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif; font-stretch: 66%; font-weight: 800;
